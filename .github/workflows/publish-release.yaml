name: publish-release
on:
  release:
    types:
    - published
jobs:
  publish-release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v7
    - name: AWS CodeArtifact login
      id: aws-login
      uses: Nextdoor/actions/aws-login@main
      with:
        ecr: false
        codeartifactPip: true
    - name: Configure uv CodeArtifact auth
      shell: bash
      run: |
        echo "UV_INDEX_CODEARTIFACT_USERNAME=aws" >> "$GITHUB_ENV"
        echo "UV_INDEX_CODEARTIFACT_PASSWORD=${{ steps.aws-login.outputs.codeartifactToken }}" >> "$GITHUB_ENV"
    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        enable-cache: true
        cache-dependency-glob: |
          uv.lock
          .python-version
    - run: uv sync --frozen
      shell: bash
    - name: Build package
      run: uv build
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
